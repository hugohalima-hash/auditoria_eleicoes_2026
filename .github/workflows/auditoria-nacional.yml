name: Auditoria nacional v3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/auditoria-nacional.yml']
permissions:
  contents: read
concurrency:
  group: auditoria-nacional-v3
  cancel-in-progress: false
jobs:
  preparar:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Testes de regressão
        run: python3 -m unittest -v test_motor test_lote test_validacao
      - name: Criar checkpoint persistente
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="auditoria-v3-${GITHUB_RUN_ID}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "Auditoria v3 — execução ${GITHUB_RUN_ID}" --notes "Reprocessamento nacional com fonte congelada no commit ${GITHUB_SHA}. Resultados exploratórios; sem certificação de acurácia de 99,9%. Pacotes estaduais distinguem processamento concluído, quarentena e falhas. Não constituem prova de fraude."
          fi
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('fontes_execucao.zip','w',zipfile.ZIP_DEFLATED) as z:
              for pattern in ['*.py','*.md','VERSAO.json','validacao/casos_reais.json']:
                  for p in Path('.').glob(pattern):z.write(p,p.as_posix())
          PY
          gh release upload "$tag" fontes_execucao.zip --clobber
  estados:
    needs: preparar
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        uf: [AC, AL, AM, AP, BA, CE, DF, ES, GO, MA, MG, MS, MT, PA, PB, PE, PI, PR, RJ, RN, RO, RR, RS, SC, SE, SP, TO, ZZ]
    steps:
      - uses: actions/checkout@v4
      - name: Liberar ferramentas não utilizadas do executor temporário
        run: |
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h .
      - name: Processar e conferir UF
        env:
          UF: ${{ matrix.uf }}
          MALLOC_ARENA_MAX: '2'
        run: python3 executar_estado.py "$UF"
      - name: Preservar resultados e diagnóstico, inclusive em falha
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preparar.outputs.release }}
          UF: ${{ matrix.uf }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "pacotes/${UF}-tentativa${GITHUB_RUN_ATTEMPT}.zip" --clobber
  consolidar:
    needs: [preparar, estados]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Consolidar somente após conclusão das 28 unidades
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preparar.outputs.release }}
        run: |
          set -euo pipefail
          mkdir pacotes_recebidos
          gh release download "$TAG" --pattern '*-tentativa*.zip' --dir pacotes_recebidos
          python3 consolidar_execucao.py pacotes_recebidos
          gh release upload "$TAG" entrega_nacional/resultados_auditoria_2026.zip entrega_nacional/triagem_nacional.zip entrega_nacional/relatorio_auditoria_2026.md entrega_nacional/resumo_nacional.json --clobber
